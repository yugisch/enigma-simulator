<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enigma Machine Simulator</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>

  <header class="header">
    <h1>Enigma Machine</h1>
    <p class="subtitle">Classic 3-rotor simulator · Wehrmacht M3</p>
  </header>

  <main class="main">
    <section class="output-strip" aria-live="polite">
      <div class="output-block">
        <span class="output-label">Plain</span>
        <div class="output-text" id="plain-out">—</div>
      </div>
      <div class="output-divider"></div>
      <div class="output-block">
        <span class="output-label">Cipher</span>
        <div class="output-text cipher" id="cipher-out">—</div>
      </div>
    </section>

    <section class="machine">
      <div class="rotor-deck">
        <div class="rotor-unit" data-rotor="0">
          <span class="rotor-name">L</span>
          <div class="rotor-window"><span id="pos-L">A</span></div>
          <div class="rotor-controls">
            <button type="button" class="rotor-btn" data-act="up" data-rotor="0" title="Advance">▲</button>
            <button type="button" class="rotor-btn" data-act="down" data-rotor="0" title="Back">▼</button>
          </div>
        </div>
        <div class="rotor-unit" data-rotor="1">
          <span class="rotor-name">M</span>
          <div class="rotor-window"><span id="pos-M">A</span></div>
          <div class="rotor-controls">
            <button type="button" class="rotor-btn" data-act="up" data-rotor="1" title="Advance">▲</button>
            <button type="button" class="rotor-btn" data-act="down" data-rotor="1" title="Back">▼</button>
          </div>
        </div>
        <div class="rotor-unit" data-rotor="2">
          <span class="rotor-name">R</span>
          <div class="rotor-window"><span id="pos-R">A</span></div>
          <div class="rotor-controls">
            <button type="button" class="rotor-btn" data-act="up" data-rotor="2" title="Advance">▲</button>
            <button type="button" class="rotor-btn" data-act="down" data-rotor="2" title="Back">▼</button>
          </div>
        </div>
      </div>

      <div class="lampboard" id="lampboard"></div>
      <div class="keyboard" id="keyboard"></div>
      <p class="type-hint">Type on your keyboard · only A–Z count · Space adds a gap</p>
    </section>

    <aside class="side">
      <div class="panel">
        <h2>Settings</h2>

        <div class="setting-row">
          <label>Rotors</label>
          <div class="rotor-selects">
            <select id="rotor-L" aria-label="Left rotor"></select>
            <select id="rotor-M" aria-label="Middle rotor"></select>
            <select id="rotor-R" aria-label="Right rotor"></select>
          </div>
        </div>

        <div class="setting-row">
          <label>Ring settings</label>
          <div class="ring-inputs">
            <input type="text" id="ring-L" maxlength="1" value="A" aria-label="Left ring" />
            <input type="text" id="ring-M" maxlength="1" value="A" aria-label="Middle ring" />
            <input type="text" id="ring-R" maxlength="1" value="A" aria-label="Right ring" />
          </div>
        </div>

        <div class="setting-row">
          <label>Reflector</label>
          <select id="reflector">
            <option value="B">B (standard)</option>
            <option value="C">C</option>
          </select>
        </div>

        <div class="setting-row">
          <label>Plugboard</label>
          <input type="text" id="plugboard" placeholder="e.g. AB CD EF" spellcheck="false" autocomplete="off" />
          <span class="field-hint">Pairs of letters, space-separated</span>
        </div>

        <div class="btn-row">
          <button type="button" class="btn" id="btn-reset-pos">Reset positions</button>
          <button type="button" class="btn btn-ghost" id="btn-clear">Clear text</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="footer">
    <p>Educational simulation · Inspired by the Wehrmacht Enigma M3</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
